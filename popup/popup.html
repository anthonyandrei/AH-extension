<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchersHub Enlistment Automator</title>
  <link rel="stylesheet" href="../styles/popup.css">
</head>
<body>
  <div class="hdr">
    <h1>Enlistment</h1>
  </div>

  <div class="b-tabs" role="tablist">
    <button class="b-tab" id="tabPlan" role="tab" aria-selected="true" aria-controls="panelPlan">Plan</button>
    <button class="b-tab" id="tabRun" role="tab" aria-selected="false" aria-controls="panelRun">Run</button>
    <button class="b-tab" id="tabReport" role="tab" aria-selected="false" aria-controls="panelReport">Report</button>
  </div>

  <div id="panelPlan" class="sec" role="tabpanel" aria-labelledby="tabPlan">
    <table class="b-plan">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Wanted Section</th>
          <th>Now</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="planRows"></tbody>
    </table>

    <div class="add-row">
      <select id="addCourse" class="b-sel" aria-label="Add subject">
        <option value="">Add a subject…</option>
      </select>
      <button id="addBtn" class="btn btn-ghost">Add</button>
    </div>

    <div id="planStatus"></div>
  </div>

  <div id="panelRun" class="sec" role="tabpanel" aria-labelledby="tabRun" hidden>
    <p class="empty">Nothing is running.</p>
  </div>

  <div id="panelReport" class="sec" role="tabpanel" aria-labelledby="tabReport" hidden>
    <p class="empty">No Vigil has run yet.</p>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
